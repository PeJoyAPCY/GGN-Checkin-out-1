<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GGN Check-in/Check-out</title>


  <style>

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background-color: #fdf5f7;
      color: #400000;
    }


    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 10px;
      background-color: #ddd;
      border-radius: 50%;
      overflow: hidden;
    }


    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    .zone-title {
      margin: 0;
      font-size: 22px;
      color: #800000;
      margin-bottom: 5px;
      text-align: center;
    }


    .system-title {
      margin: 0;
      font-size: 18px;
      color: #800000;
      margin-bottom: 15px;
      text-align: center;
    }


    label {
      margin-right: 15px;
      font-weight: bold;
    }


    input[type="radio"] {
      margin-right: 5px;
    }


    input[type="file"],
    textarea,
    input[type="text"],
    button {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }


    button {
      background-color: #800000;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }


    button:hover {
      background-color: #a00000;
    }


    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }


    #previewText {
      background: #fff5f5;
      border: 1px solid #d9b3b3;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 15px;
      margin-top: 10px;
    }


    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }


    #previewContainer img {
      width: 120px;
      height: 160px;
      object-fit: cover;
      border: 2px solid #800000;
      border-radius: 6px;
    }


    #status {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      color: #800000;
      white-space: pre-wrap;
    }


    canvas {
      display: none;
    }

  </style>

</head>


<body>


  <!-- ==================================================
       LOGO
       ================================================== -->

  <div class="logo">

    <img
      src="https://img2.pic.in.th/pic/logo-ggn.png"
      alt="โลโก้"
    >

  </div>



  <!-- ==================================================
       ZONE
       ================================================== -->

  <h2 class="zone-title">
    เขต 1
  </h2>


  <h2 class="system-title">
    📷 ระบบ Check in / Check out
  </h2>



  <!-- ==================================================
       JOB TYPE
       ================================================== -->

  <div>

    <label>

      <input
        type="radio"
        name="jobType"
        value="Check in (เข้างาน)"
      >

      Check in (เข้างาน)

    </label>


    <label>

      <input
        type="radio"
        name="jobType"
        value="Check out (ออกงาน)"
      >

      Check out (ออกงาน)

    </label>

  </div>



  <!-- ==================================================
       NAME
       ================================================== -->

  <input
    type="text"
    id="fullname"
    placeholder="ชื่อ-นามสกุล (บังคับกรอก)"
  >



  <!-- ==================================================
       EXTRA TEXT
       ================================================== -->

  <textarea
    id="text"
    rows="2"
    placeholder="ข้อความเพิ่มเติม-จุดรักษาการณ์ (ถ้ามี)"
  ></textarea>



  <!-- ==================================================
       PREVIEW TEXT
       ================================================== -->

  <div id="previewText"></div>



  <!-- ==================================================
       IMAGE
       ================================================== -->

  <input
    type="file"
    id="imageInput"
    accept="image/jpeg,image/png"
    multiple
  >



  <!-- ==================================================
       SEND BUTTON
       ================================================== -->

  <button id="sendBtn">

    ส่งข้อมูล Check-in / Check-out

  </button>



  <!-- ==================================================
       IMAGE PREVIEW
       ================================================== -->

  <div id="previewContainer"></div>



  <!-- ==================================================
       STATUS
       ================================================== -->

  <div id="status"></div>



  <canvas id="canvas"></canvas>



  <script>


    // ==================================================
    // GOOGLE APPS SCRIPT
    // ==================================================

    const GOOGLE_APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx2m2LxgDZfEjaHf3RJLF7MU6004tA_6vP_dFp3aDSuefSgbq5k__nUpfPPp2Y-Lj2Pig/exec";



    // ==================================================
    // ZONE
    // ==================================================

    const ZONE =
      "เขต 1";



    // ==================================================
    // ELEMENTS
    // ==================================================

    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const previewContainer =
      document.getElementById(
        "previewContainer"
      );


    const previewText =
      document.getElementById(
        "previewText"
      );


    const extraText =
      document.getElementById(
        "text"
      );


    const fullname =
      document.getElementById(
        "fullname"
      );


    const status =
      document.getElementById(
        "status"
      );


    const sendBtn =
      document.getElementById(
        "sendBtn"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    let photos = [];



    // ==================================================
    // GET SELECTED JOB
    // ==================================================

    function getSelectedJob() {

      const selected =
        document.querySelector(
          'input[name="jobType"]:checked'
        );


      return selected
        ? selected.value
        : "";

    }



    // ==================================================
    // IMAGE SELECT
    // ==================================================

    imageInput.addEventListener(
      "change",
      function (event) {

        photos =
          Array.from(
            event.target.files
          ).filter(
            function (file) {

              const fileName =
                file.name
                  .toLowerCase();


              if (
                file.type === "image/heic" ||
                file.type === "image/heif" ||
                fileName.endsWith(".heic") ||
                fileName.endsWith(".heif")
              ) {

                alert(
                  "ไม่รองรับไฟล์ .heic / .heif กรุณาใช้ .jpg หรือ .png"
                );

                return false;

              }


              if (
                !file.type.startsWith("image/")
              ) {

                return false;

              }


              return true;

            }
          );


        updatePreview();

        updatePreviewText();

      }
    );



    // ==================================================
    // IMAGE PREVIEW
    // ==================================================

    function updatePreview() {

      previewContainer.innerHTML =
        "";


      photos.forEach(
        function (file) {

          const img =
            document.createElement(
              "img"
            );


          const objectUrl =
            URL.createObjectURL(
              file
            );


          img.src =
            objectUrl;


          img.onload =
            function () {

              URL.revokeObjectURL(
                objectUrl
              );

            };


          previewContainer.appendChild(
            img
          );

        }
      );

    }



    // ==================================================
    // TEXT PREVIEW
    // ==================================================

    function updatePreviewText() {

      const job =
        getSelectedJob() ||
        "-";


      const extra =
        extraText.value.trim();


      const name =
        fullname.value.trim() ||
        "-";


      const now =
        new Date();


      const nowStr =
        now.toLocaleString(
          "th-TH"
        );


      previewText.textContent =

        `📅 ${nowStr}\n` +

        `📍 เขต: ${ZONE}\n` +

        `👤 ชื่อ: ${name}\n` +

        `📌 งาน: ${job}` +

        (
          extra
            ? `\n📝 ${extra}`
            : ""
        );

    }



    // ==================================================
    // EVENTS
    // ==================================================

    extraText.addEventListener(
      "input",
      updatePreviewText
    );


    fullname.addEventListener(
      "input",
      updatePreviewText
    );


    document
      .querySelectorAll(
        'input[name="jobType"]'
      )
      .forEach(
        function (element) {

          element.addEventListener(
            "change",
            updatePreviewText
          );

        }
      );



    // ==================================================
    // PROCESS IMAGE
    // ==================================================

    async function processImage(file) {

      return new Promise(
        function (resolve, reject) {

          const img =
            new Image();


          const objectUrl =
            URL.createObjectURL(
              file
            );


          img.onload =
            function () {

              try {

                /*
                 * จำกัดขนาดรูปเพื่อไม่ให้
                 * Base64 ใหญ่เกินไป
                 *
                 * Telegram รองรับรูปขนาดใหญ่
                 * แต่การส่งผ่าน Browser → Apps Script
                 * ไม่ควรให้ Request ใหญ่เกินจำเป็น
                 */

                const MAX_WIDTH =
                  1600;

                const MAX_HEIGHT =
                  1600;


                let width =
                  img.naturalWidth;


                let height =
                  img.naturalHeight;


                if (
                  width > MAX_WIDTH ||
                  height > MAX_HEIGHT
                ) {

                  const ratio =
                    Math.min(

                      MAX_WIDTH / width,

                      MAX_HEIGHT / height

                    );


                  width =
                    Math.round(
                      width * ratio
                    );


                  height =
                    Math.round(
                      height * ratio
                    );

                }


                canvas.width =
                  width;


                canvas.height =
                  height;


                ctx.clearRect(
                  0,
                  0,
                  width,
                  height
                );


                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );


                canvas.toBlob(

                  function (blob) {

                    URL.revokeObjectURL(
                      objectUrl
                    );


                    if (!blob) {

                      reject(
                        new Error(
                          "ไม่สามารถประมวลผลรูปภาพได้"
                        )
                      );

                      return;

                    }


                    resolve(
                      blob
                    );

                  },

                  "image/jpeg",

                  0.82

                );

              } catch (error) {

                URL.revokeObjectURL(
                  objectUrl
                );


                reject(
                  error
                );

              }

            };


          img.onerror =
            function () {

              URL.revokeObjectURL(
                objectUrl
              );


              reject(
                new Error(
                  "ไม่สามารถเปิดรูปภาพได้"
                )
              );

            };


          img.src =
            objectUrl;

        }
      );

    }



    // ==================================================
    // BLOB → BASE64
    // ==================================================

    function blobToBase64(blob) {

      return new Promise(
        function (resolve, reject) {

          const reader =
            new FileReader();


          reader.onload =
            function () {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            function () {

              reject(
                new Error(
                  "ไม่สามารถอ่านรูปภาพได้"
                )
              );

            };


          reader.readAsDataURL(
            blob
          );

        }
      );

    }



    // ==================================================
    // SEND REQUEST
    //
    // สำคัญ:
    // ไม่กำหนด Content-Type header เอง
    // เพื่อไม่กระตุ้น CORS preflight
    // ==================================================

    async function sendRequestToAppsScript(
      payload
    ) {

      console.log(
        "📤 กำลังส่งข้อมูลไป Apps Script",
        payload
      );


      let response;


      try {

        response =
          await fetch(

            GOOGLE_APPS_SCRIPT_URL,

            {

              method:
                "POST",

              /*
               * ไม่ใส่ headers
               *
               * Apps Script จะอ่านข้อมูลจาก
               * e.postData.contents
               */

              body:
                JSON.stringify(
                  payload
                ),

              redirect:
                "follow"

            }

          );

      } catch (error) {

        console.error(
          "❌ Network / Fetch Error:",
          error
        );


        throw new Error(
          "ไม่สามารถเชื่อมต่อ Google Apps Script ได้\n" +
          "กรุณาตรวจสอบ URL และการ Deploy Web App"
        );

      }


      console.log(
        "📡 HTTP Status:",
        response.status
      );


      console.log(
        "📡 Response OK:",
        response.ok
      );


      let responseText;


      try {

        responseText =
          await response.text();

      } catch (error) {

        console.error(
          "❌ อ่าน Response ไม่สำเร็จ:",
          error
        );


        throw new Error(
          "ไม่สามารถอ่านข้อมูลตอบกลับจาก Apps Script ได้"
        );

      }


      console.log(
        "📥 Apps Script Raw Response:",
        responseText
      );


      if (
        !responseText
      ) {

        throw new Error(
          "Apps Script ไม่ได้ส่งข้อมูลตอบกลับ"
        );

      }


      let result;


      try {

        result =
          JSON.parse(
            responseText
          );

      } catch (error) {

        console.error(
          "❌ Response ไม่ใช่ JSON:",
          responseText
        );


        throw new Error(
          "Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON"
        );

      }


      console.log(
        "📥 Apps Script Response:",
        result
      );


      if (
        !result.success
      ) {

        throw new Error(

          result.message ||

          result.error ||

          "Apps Script ส่งข้อมูลไม่สำเร็จ"

        );

      }


      return result;

    }



    // ==================================================
    // SEND TO GOOGLE APPS SCRIPT
    // ==================================================

    async function sendToGoogleAppsScript() {

      const name =
        fullname.value.trim();


      const job =
        getSelectedJob();


      const extraMsg =
        extraText.value.trim();



      // ==================================================
      // VALIDATE NAME
      // ==================================================

      if (!name) {

        alert(
          "กรุณากรอกชื่อ-นามสกุล"
        );

        fullname.focus();

        return;

      }


      if (/\d/.test(name)) {

        alert(
          "ห้ามกรอกตัวเลขในชื่อ-นามสกุล"
        );

        fullname.focus();

        return;

      }



      // ==================================================
      // VALIDATE JOB
      // ==================================================

      if (!job) {

        alert(
          "กรุณาเลือกประเภทงาน"
        );

        return;

      }



      // ==================================================
      // VALIDATE IMAGE
      // ==================================================

      if (
        photos.length === 0
      ) {

        alert(
          "กรุณาเลือกรูปภาพ"
        );

        return;

      }



      // ==================================================
      // CHECK API URL
      // ==================================================

      if (
        !GOOGLE_APPS_SCRIPT_URL ||
        GOOGLE_APPS_SCRIPT_URL.includes(
          "YOUR_GOOGLE_APPS_SCRIPT"
        )
      ) {

        alert(
          "ยังไม่ได้ตั้งค่า Google Apps Script URL"
        );

        return;

      }



      // ==================================================
      // UI
      // ==================================================

      sendBtn.disabled =
        true;


      status.textContent =
        "⏳ กำลังเตรียมส่งข้อมูล...";


      updatePreviewText();



      try {


        // ==================================================
        // ส่งทีละรูป
        // ==================================================

        for (
          let i = 0;
          i < photos.length;
          i++
        ) {


          status.textContent =
            `⏳ กำลังเตรียมรูป ${i + 1}/${photos.length}...`;



          // ==================================================
          // PROCESS IMAGE
          // ==================================================

          const blob =
            await processImage(
              photos[i]
            );



          console.log(
            "🖼️ รูปที่ประมวลผลแล้ว:",
            {
              name:
                photos[i].name,

              originalSize:
                photos[i].size,

              processedSize:
                blob.size,

              type:
                blob.type
            }
          );



          // ==================================================
          // BLOB → BASE64
          // ==================================================

          status.textContent =
            `⏳ กำลังเตรียมข้อมูลรูป ${i + 1}/${photos.length}...`;


          const imageBase64 =
            await blobToBase64(
              blob
            );



          // ==================================================
          // PAYLOAD
          // ==================================================

          const payload = {

            zone:
              ZONE,

            fullname:
              name,

            jobType:
              job,

            extraText:
              extraMsg,

            imageBase64:
              imageBase64,

            imageName:
              `checkin-${Date.now()}-${i + 1}.jpg`

          };



          console.log(
            "📦 Payload:",
            {
              zone:
                payload.zone,

              fullname:
                payload.fullname,

              jobType:
                payload.jobType,

              extraText:
                payload.extraText,

              imageName:
                payload.imageName,

              imageBase64Length:
                payload.imageBase64.length
            }
          );



          // ==================================================
          // SEND
          // ==================================================

          status.textContent =
            `⏳ กำลังส่งรูป ${i + 1}/${photos.length} ไป Telegram...`;


          const result =
            await sendRequestToAppsScript(
              payload
            );



          console.log(
            `✅ รูป ${i + 1} สำเร็จ`,
            result
          );

        }



        // ==================================================
        // SUCCESS
        // ==================================================

        status.textContent =
          "✅ ส่งข้อมูลสำเร็จแล้ว";


        alert(
          "ส่งข้อมูล Check-in / Check-out สำเร็จแล้ว"
        );



        // ==================================================
        // RESET
        // ==================================================

        photos = [];


        updatePreview();


        previewText.textContent =
          "";


        extraText.value =
          "";


        fullname.value =
          "";


        imageInput.value =
          "";


        document
          .querySelectorAll(
            'input[name="jobType"]'
          )
          .forEach(
            function (element) {

              element.checked =
                false;

            }
          );


        updatePreviewText();


      } catch (error) {


        console.error(
          "❌ GGN Check-in Error:",
          error
        );


        status.textContent =
          "❌ ส่งข้อมูลไม่สำเร็จ\n" +
          error.message;


        alert(
          "ส่งข้อมูลไม่สำเร็จ\n\n" +
          error.message
        );


      } finally {

        sendBtn.disabled =
          false;

      }

    }



    // ==================================================
    // BUTTON
    // ==================================================

    sendBtn.addEventListener(
      "click",
      sendToGoogleAppsScript
    );



    // ==================================================
    // INITIAL PREVIEW
    // ==================================================

    updatePreviewText();

  </script>

</body>

</html>
